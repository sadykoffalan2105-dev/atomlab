# https://atomlab-alan-sadykov.netlify.app — деплой с GitHub main
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE = "/"
  LEARN_TTS_PROVIDER = "edge"

# Serverless-функция neural-голоса учителя (ru-RU-DmitryNeural).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/learn/tts"
  to = "/.netlify/functions/learn-tts"
  status = 200

# После деплоя не кэшировать index.html — иначе браузер тянет старый JS-бандл
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
