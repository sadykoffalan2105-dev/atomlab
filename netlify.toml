# https://atomlab-alan-sadykov.netlify.app — деплой с GitHub main
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # HashRouter: корень сайта, не /atomlab/ (это только GitHub Pages)
  VITE_BASE = "/"

# После деплоя не кэшировать index.html — иначе браузер тянет старый JS-бандл
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
