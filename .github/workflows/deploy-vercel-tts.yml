# Деплой serverless TTS (api/learn/tts) на Vercel — бесплатный бэкенд для GitHub Pages.
# Секреты: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (vercel link)

name: Deploy Vercel TTS API

# Запуск только вручную: сайт работает без сервера; секреты проверяются внутри job.
on:
  workflow_dispatch:

concurrency:
  group: deploy-vercel-tts
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip — VERCEL_TOKEN not configured"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: Deploy API to Vercel
        if: steps.secrets.outputs.ok == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
