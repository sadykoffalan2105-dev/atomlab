# Сборка + публикация сайта (обходит лимит Netlify).
# Источник GitHub Pages в настройках репозитория — «GitHub Actions» (build_type: workflow):
# сайт выкладывается артефактом через actions/deploy-pages (job deploy). Ветка gh-pages
# остаётся копией, но сама по себе сайт НЕ обновляет — поэтому он застрял на версии 30.07.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: /atomlab/
          VITE_LEARN_CHAT_URL: ${{ secrets.VITE_LEARN_CHAT_URL }}
          VITE_LEARN_TTS_URL: ${{ secrets.VITE_LEARN_TTS_URL != '' && secrets.VITE_LEARN_TTS_URL || secrets.VERCEL_TTS_URL != '' && secrets.VERCEL_TTS_URL || 'https://atomlab-alan-sadykov.netlify.app/api/learn/tts' }}
        run: npm run build

      - name: Verify new learn UI in bundle
        run: |
          grep -rq "learn.molecules.structure.title" dist/assets/
          grep -rq "learn.classRoster.title" dist/assets/
          grep -rq "Конспект по пробелам" dist/assets/ || grep -rq "learn.studentStats.conspect.title" dist/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Mirror dist to gh-pages (копия; сайт публикует job deploy)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'Deploy site ${{ github.sha }}'

      - name: Deploy TTS function to Netlify (optional)
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Skip Netlify — secrets not configured"
            exit 0
          fi
          npx netlify-cli@23 deploy --prod --dir=dist --functions=netlify/functions --message="TTS+site ${{ github.sha }}"

      - name: Deploy TTS Cloudflare Worker (optional)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skip Cloudflare — secrets not configured"
            exit 0
          fi
          npx wrangler deploy

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
