# Сборка + публикация сайта (обходит лимит Netlify).
# Включает GitHub Pages автоматически и публикует ветку gh-pages.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: /atomlab/
          VITE_LEARN_CHAT_URL: ${{ secrets.VITE_LEARN_CHAT_URL }}
        run: npm run build

      - name: Verify new learn UI in bundle
        run: |
          grep -rq "learn.molecules.structure.title" dist/assets/
          grep -rq "learn.classRoster.title" dist/assets/

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'Deploy site ${{ github.sha }}'
