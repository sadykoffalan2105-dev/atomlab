# Сборка + публикация сайта (обходит лимит Netlify).
# Включает GitHub Pages автоматически и публикует ветку gh-pages.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: /atomlab/
          VITE_LEARN_CHAT_URL: ${{ secrets.VITE_LEARN_CHAT_URL }}
          VITE_LEARN_TTS_URL: ${{ secrets.VITE_LEARN_TTS_URL != '' && secrets.VITE_LEARN_TTS_URL || secrets.VERCEL_TTS_URL != '' && secrets.VERCEL_TTS_URL || 'https://atomlab-alan-sadykov.netlify.app/api/learn/tts' }}
        run: npm run build

      - name: Deploy TTS function to Netlify (CLI, без минут сборки)
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
        run: npx netlify-cli@23 deploy --prod --dir=dist --functions=netlify/functions --message="TTS+site ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy TTS Cloudflare Worker (если заданы CF-секреты)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify new learn UI in bundle
        run: |
          grep -rq "learn.molecules.structure.title" dist/assets/
          grep -rq "learn.classRoster.title" dist/assets/

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'Deploy site ${{ github.sha }}'
