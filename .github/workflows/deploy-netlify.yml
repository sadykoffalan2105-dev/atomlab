# Сборка и деплой на Netlify (сайт + serverless TTS) при push в main.
# CLI-деплой не тратит минуты сборки Netlify (в отличие от «Deploy from Git»).
# Сайт: https://atomlab-alan-sadykov.netlify.app

name: Deploy Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build frontend
        env:
          VITE_BASE: /
        run: npm run build

      - name: Verify gap conspect in bundle
        run: |
          grep -rq "Конспект по пробелам" dist/assets/ || grep -rq "learn.studentStats.conspect.title" dist/assets/

      - name: Deploy site + TTS function (Netlify CLI)
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
        run: npx netlify-cli@23 deploy --prod --dir=dist --functions=netlify/functions --message="Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
