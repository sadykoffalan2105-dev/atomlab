name: Deploy GitHub Pages

# Отключён: сайт публикуется через publish-site.yml → ветка gh-pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE: /atomlab/
          VITE_LEARN_CHAT_URL: ${{ secrets.VITE_LEARN_CHAT_URL }}
        run: npm run build

      - name: Verify molecule catalog bundle
        run: |
          grep -rq "learn.molecules.structure.title" dist/assets/ || (echo "Missing molecule catalog build" && exit 1)
          grep -rq "learn.classRoster.title" dist/assets/ || (echo "Missing class roster build" && exit 1)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
