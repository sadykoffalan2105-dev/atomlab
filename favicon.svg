<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c18"/>
      <stop offset="100%" stop-color="#12183a"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dffec"/>
      <stop offset="100%" stop-color="#aa3bff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7afcff"/>
      <stop offset="55%" stop-color="#3dffec"/>
      <stop offset="100%" stop-color="#1a6bff"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(61,255,236,0.08)" stroke-width="2"/>
  <ellipse cx="256" cy="256" rx="190" ry="72" fill="none" stroke="url(#orbit)" stroke-width="10" opacity="0.85" transform="rotate(-28 256 256)"/>
  <ellipse cx="256" cy="256" rx="190" ry="72" fill="none" stroke="url(#orbit)" stroke-width="8" opacity="0.55" transform="rotate(38 256 256)"/>
  <ellipse cx="256" cy="256" rx="190" ry="72" fill="none" stroke="url(#orbit)" stroke-width="6" opacity="0.35" transform="rotate(98 256 256)"/>
  <circle cx="256" cy="256" r="58" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="34" fill="#e8ffff" opacity="0.35"/>
  <circle cx="430" cy="210" r="22" fill="#3dffec" filter="url(#glow)"/>
  <circle cx="118" cy="318" r="18" fill="#aa3bff" filter="url(#glow)"/>
  <circle cx="320" cy="390" r="14" fill="#7afcff"/>
</svg>
